<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Granary — Clearing Session</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0a0f0d;
      color: #e0e7e3;
    }
    .card {
      text-align: center;
      padding: 2rem;
      border-radius: 1.5rem;
      border: 1px solid #1e3a2a;
      background: #0f1a14;
      max-width: 400px;
    }
    .spinner {
      width: 2rem;
      height: 2rem;
      border: 3px solid rgba(52, 211, 153, 0.2);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    p { font-size: 0.875rem; color: #9ca3af; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Clearing stale session…</h1>
    <p>Redirecting you back in a moment.</p>
  </div>
  <script>
    setTimeout(function() {
      window.location.href = "/";
    }, 1500);
  </script>
</body>
</html>
